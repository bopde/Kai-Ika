<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kai Ika – Operations Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kaiBurgundy: '#6B1F1F',
            kaiGreen: '#3E5C48',
            kaiYellow: '#F2E6D8',
            kaiBlue: '#1F3A5F'
          },
          fontFamily: {
            serif: ['Playfair Display','serif'],
            sans: ['Inter','sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-kaiYellow font-sans">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ---------------------------
// CONSTANTS (easy to edit)
// ---------------------------
const PRODUCTS = [
  "Blue Nose (LG)",
  "Blue Nose (Sml)",
  "Cap - Blue LegaSea",
  "Cap - Sand LegaSea",
  "Coke",
  "COKE Zero",
  "Crispy Batter",
  "Donation",
  "Fish other",
  "GUR",
  "Hapuku (LG)",
  "Hapuku (Sml)",
  "JOHN",
  "KAH",
  "Kai Ika Tee Shirt",
  "KING Fillet",
  "King Steaked",
  "Knife Gill & Gut",
  "Knife Set ($325)",
  "Knife Single Filleting",
  "Knife Single Skinning",
  "Knife Single Steaking",
  "L&P",
  "LegaSea UV Hoodie",
  "LegaSea UV Round Neck",
  "LegaSea UV Zip",
  "Mackeral",
  "Mahi",
  "Marlin Large",
  "Marlin Sml",
  "Other",
  "Panko",
  "Raffle Ticket 1 @ $10",
  "Raffle Ticket X 5 ($40)",
  "Shake n Bake",
  "Sharpen",
  "Sistema 3.8L",
  "SNA",
  "SNA Scale & Fillet",
  "SNA Scale Gut & Gill",
  "SNA Scale only",
  "Sprite",
  "TAR",
  "Tempura Batter",
  "TREV",
  "Tuna Lg",
  "Tuna Med",
  "Tuna SM"
];

const STAFF = ["Ben","Connor","Dave","Opu","Matt","Jay", "Volunteer"];
const TASKS = ["Filleting","Distributions","Scotts","Cans","Other"];
const DISTRIBUTION_LOCATIONS = [
  "Akeli","Donald","Dave","Walk-in","Ōrakei","Māngere"
];
const CANS_LOCATIONS = [
  "North Shore","Onehunga","Takanini","Otahuhu"
];
const BIN_SOURCES = [
  "Westhaven","Hilton","Scott's","Moana"
];

// ---------------------------
// NEW DISTRIBUTION / COLLECTION SOURCES
// ---------------------------
const OFFAL_SOURCES = ["Westhaven", "OBC"];
const REDISTRIBUTION_SOURCES = ["Grace Foundation", "Everybody Eats"];

// ---------------------------
// APP
// ---------------------------
function App() {
  const [webAppUrl, setWebAppUrl] = useState(localStorage.getItem("opsWebAppUrl") || "");
  const [configured, setConfigured] = useState(!!localStorage.getItem("opsWebAppUrl"));
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);
  const [showSummary, setShowSummary] = useState(false);
  const [copied, setCopied] = useState(false);

  // Permanent fields
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [formCompletedBy, setFormCompletedBy] = useState("");

  // Sections
  const [staffRows, setStaffRows] = useState([]);
  const [salesRows, setSalesRows] = useState([]);
  const [distributionRows, setDistributionRows] = useState([]);
  const [cansRows, setCansRows] = useState([]);
  const [totalSales, setTotalSales] = useState("");
  const [notes, setNotes] = useState("");
  const [fishMonitored, setFishMonitored] = useState("");
  const [roeCollected, setRoeCollected] = useState("");
  const [binsCollected, setBinsCollected] = useState("");
  const [binSource, setBinSource] = useState("Westhaven");

  // NEW Distribution / Collection fields
  const [showDistCollectionExtra, setShowDistCollectionExtra] = useState(false);
  const [binsOffalCollected, setBinsOffalCollected] = useState("");
  const [binsOffalSource, setBinsOffalSource] = useState(OFFAL_SOURCES[0]);
  const [binsRedistributed, setBinsRedistributed] = useState("");
  const [binsRedistributionSource, setBinsRedistributionSource] = useState(REDISTRIBUTION_SOURCES[0]);

  // Visibility
  const [showStaff, setShowStaff] = useState(false);
  const [showSales, setShowSales] = useState(false);
  const [showDistributions, setShowDistributions] = useState(false);
  const [showCans, setShowCans] = useState(false);
  const [showOther, setShowOther] = useState(false);
  const [showNotes, setShowNotes] = useState(false);

  // Summary Page
  const buildSummaryText = () => {
  return `Date: ${date || "-"}
Form Completed By: ${formCompletedBy || "-"}

--- Staff ---
${staffRows.length > 0
  ? staffRows.map(r =>
      `Name: ${r.staffName || "-"}, Task: ${r.task || "-"}, Start: ${r.startTime || "-"}, End: ${r.endTime || "-"}`
    ).join("\n")
  : "0"}

--- Sales ---
${salesRows.length > 0
  ? salesRows.map(r => `${r.productName || "-"}: ${r.quantity || 0}`).join("\n")
  : "0"}
Total Sales: $${totalSales || 0}

--- Distribution / Collection ---
Bins Collected: ${binsCollected || 0} (Source: ${binSource || "-"})
${showDistCollectionExtra ? 
`Bins Offal Collected: ${binsOffalCollected || 0} (Source: ${binsOffalSource})
Bins Redistributed: ${binsRedistributed || 0} (Source: ${binsRedistributionSource})`
: ""}
${distributionRows.length > 0
  ? distributionRows.map(r =>
      `Bins Distributed: ${r.binsDistributed || 0} (Source: ${r.distributionTo || "-"})`
    ).join("\n")
  : "Bins Distributed: 0"}

--- Cans ---
${cansRows.length > 0
  ? cansRows.map(r =>
      `Cans Dropped Off: ${r.cansKg || 0} KG (Location: ${r.cansLocation || "-"})`
    ).join("\n")
  : "Cans Dropped Off: 0 Kg"}

--- Other ---
Fish Monitored: ${fishMonitored || 0}
Roe Collected: ${roeCollected || 0}

--- Notes ---
${notes || "None"}`;
};

  // Autosave
  useEffect(() => {
    localStorage.setItem("opsFormData", JSON.stringify({
      date, formCompletedBy, staffRows, salesRows, distributionRows, cansRows, totalSales, notes, fishMonitored, roeCollected, binsCollected, binSource,
      showDistCollectionExtra, binsOffalCollected, binsOffalSource, binsRedistributed, binsRedistributionSource
    }));
  }, [date, formCompletedBy, staffRows, salesRows, distributionRows, cansRows, totalSales, notes, fishMonitored, roeCollected, binsCollected, binSource,
      showDistCollectionExtra, binsOffalCollected, binsOffalSource, binsRedistributed, binsRedistributionSource]);

  // Load saved
  useEffect(() => {
    const saved = localStorage.getItem("opsFormData");
    if(saved){
      const data = JSON.parse(saved);
      setDate(data.date || new Date().toISOString().slice(0,10));
      setFormCompletedBy(data.formCompletedBy || "");
      setStaffRows(data.staffRows || []);
      setSalesRows(data.salesRows || []);
      setDistributionRows(data.distributionRows || []);
      setCansRows(data.cansRows || []);
      setTotalSales(data.totalSales || "");
      setNotes(data.notes || "");
      setFishMonitored(data.fishMonitored || "");
      setRoeCollected(data.roeCollected || "");
      setBinsCollected(data.binsCollected || "");
      setBinSource(data.binSource || "Westhaven");
      setShowDistCollectionExtra(data.showDistCollectionExtra || false);
      setBinsOffalCollected(data.binsOffalCollected || "");
      setBinsOffalSource(data.binsOffalSource || OFFAL_SOURCES[0]);
      setBinsRedistributed(data.binsRedistributed || "");
      setBinsRedistributionSource(data.binsRedistributionSource || REDISTRIBUTION_SOURCES[0]);
      setShowStaff(data.staffRows?.length > 0);
      setShowSales(data.salesRows?.length > 0 || !!data.totalSales);
      setShowDistributions(data.distributionRows?.length > 0 || !!data.binsCollected);
      setShowCans(data.cansRows?.length > 0);
      setShowOther(!!data.fishMonitored || !!data.roeCollected);
      setShowNotes(!!data.notes);
    }
  }, []);

  // ---------------------------
  // ROW MANAGEMENT
  // ---------------------------
  const addStaff = () => { setStaffRows([...staffRows, { staffName:STAFF[0], task:TASKS[0], startTime:"", endTime:"" }]); setShowStaff(true); }
  const addSales = () => { setSalesRows([...salesRows, { productName:"", quantity:"" }]); setShowSales(true); }
  const addDistribution = () => { setDistributionRows([...distributionRows, { binsDistributed:"", distributionTo:DISTRIBUTION_LOCATIONS[0] }]); setShowDistributions(true); }
  const addCans = () => { setCansRows([...cansRows, { cansKg:"", cansLocation:CANS_LOCATIONS[0] }]); setShowCans(true); }
  const addOther = () => { setShowOther(true); }
  const addNotes = () => { setShowNotes(true); }
  const removeStaff = i => setStaffRows(staffRows.filter((_,j)=>i!==j));
  const removeSales = i => setSalesRows(salesRows.filter((_,j)=>i!==j));
  const removeDistribution = i => setDistributionRows(distributionRows.filter((_,j)=>i!==j));
  const removeCans = i => setCansRows(cansRows.filter((_,j)=>i!==j));

  // ---------------------------
  // SUBMIT
  // ---------------------------
  const submit = async e => {
    e.preventDefault();
    if(!date || !formCompletedBy){ alert("Date & Form Completed By required"); return; }
    if(!webAppUrl){ alert("Please configure web app URL"); return; }

    setLoading(true);
    setSuccess(false);

    try{
      const fd = new FormData();
      const timestamp = new Date().toISOString();

      // STAFF
      staffRows.forEach(r=>{
        fd.append("Row Type","STAFF");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Staff Name",r.staffName||"");
        fd.append("Task",r.task||"");
        fd.append("Start Time",r.startTime||"");
        fd.append("End Time",r.endTime||"");
      });

      // SALES rows
      salesRows.forEach(r=>{
        fd.append("Row Type","SALES");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Product Name",r.productName||"");
        fd.append("Quantity Sold",r.quantity||"");
      });

      // TOTAL SALES
      if(totalSales){
        fd.append("Row Type","SALES_TOTAL");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Total Sales",totalSales);
      }

      // COLLECTION
      if(binsCollected){
        fd.append("Row Type","COLLECTION");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Bins Collected",binsCollected);
        fd.append("Source",binSource);
      }

      // NEW DISTRIBUTION / COLLECTION
      if(binsOffalCollected || binsRedistributed){
        fd.append("Row Type","DIST_COLLECT");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Bins Offal Collected", binsOffalCollected);
        fd.append("Bins Offal Source", binsOffalSource);
        fd.append("Bins Redistributed", binsRedistributed);
        fd.append("Bins Redistribution Source", binsRedistributionSource);
      }

      // DISTRIBUTION
      distributionRows.forEach(r=>{
        fd.append("Row Type","DISTRIBUTION");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Bins Distributed",r.binsDistributed||"");
        fd.append("Distribution To",r.distributionTo||"");
      });

      // CANS
      cansRows.forEach(r=>{
        fd.append("Row Type","CANS");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Cans KG",r.cansKg||"");
        fd.append("Cans Location",r.cansLocation||"");
      });

      // OTHER
      if(fishMonitored || roeCollected){
        fd.append("Row Type","OTHER");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Fish Monitored",fishMonitored||"");
        fd.append("Roe Collected",roeCollected||"");
      }

      // NOTES
      if(notes){
        fd.append("Row Type","NOTES");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",timestamp);
        fd.append("Notes",notes);
      }

      const res = await fetch(webAppUrl,{method:"POST",body:fd});
      const json = await res.json();
      if(!json.success) throw new Error(json.error);

      setSuccess(true);
      setTimeout(() => setShowSummary(false), 1500);
      setTimeout(() => setSuccess(false), 5000);

      // CLEAR FORM
      setStaffRows([]);
      setSalesRows([]);
      setDistributionRows([]);
      setCansRows([]);
      setTotalSales("");
      setNotes("");
      setFishMonitored("");
      setRoeCollected("");
      setBinsCollected("");
      setBinSource("Westhaven");
      setBinsOffalCollected("");
      setBinsOffalSource(OFFAL_SOURCES[0]);
      setBinsRedistributed("");
      setBinsRedistributionSource(REDISTRIBUTION_SOURCES[0]);
      setShowDistCollectionExtra(false);
      setShowStaff(false);
      setShowSales(false);
      setShowDistributions(false);
      setShowCans(false);
      setShowOther(false);
      setShowNotes(false);

    } catch(err){
      alert(err.message);
    } finally{
      setLoading(false);
    }
  }

  // ---------------------------
  // INITIAL CONFIG
  // ---------------------------
  if(!configured){
    return(
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
          <h1 className="text-3xl font-serif mb-4 text-center text-kaiBurgundy">Initial Setup</h1>
          <input
            className="w-full border rounded px-3 py-2 mb-4 font-sans"
            placeholder="Apps Script Web App URL"
            value={webAppUrl}
            onChange={e=>setWebAppUrl(e.target.value)}
          />
          <button
            className="w-full bg-kaiBurgundy hover:bg-red-700 text-white py-2 rounded font-semibold"
            onClick={()=>{ localStorage.setItem("opsWebAppUrl",webAppUrl); setConfigured(true); }}
          >Save & Continue</button>
        </div>
      </div>
    );
  }

  // ---------------------------
  // MAIN FORM
  // ---------------------------
  return(
    <div className="max-w-6xl mx-auto p-4 md:p-8">
    {/* Header */}
    <header className="w-full bg-kaiBurgundy text-white flex flex-col items-center py-6 shadow-lg mb-6 relative">
      <img 
        src="https://raw.githubusercontent.com/bopde/Kai-Ika-report/main/KAI-IKA_log_white-on-trans01.png"
        alt="Kai Ika Logo"
        className="h-20 mb-3"
      />
      <h1 className="text-4xl md:text-5xl font-serif font-bold text-center">Operations Report</h1>
    
      {/* Settings Cog */}
      <button
        onClick={()=>{ localStorage.removeItem("opsWebAppUrl"); setConfigured(false); }}
        className="absolute top-5 right-5 text-2xl hover:text-kaiYellow"
        title="Change Web App URL"
      >⚙️</button>
    </header>

    <form onSubmit={submit} className="space-y-6">
      {/* Date & Completed By */}
      <div className="grid md:grid-cols-2 gap-4">
        <div>
          <label className="block mb-1 font-medium">Date</label>
          <input type="date" className="w-full border rounded px-2 py-2" value={date} onChange={e=>setDate(e.target.value)} />
        </div>
        <div>
          <label className="block mb-1 font-medium">Form Completed By</label>
          <input type="text" className="w-full border rounded px-2 py-2" value={formCompletedBy} onChange={e=>setFormCompletedBy(e.target.value)} />
        </div>
      </div>

      {/* Staff Section */}
      <div>
        <button type="button" className="bg-kaiGreen text-white px-5 py-2 rounded font-semibold mb-2" onClick={addStaff}>+ Add Staff</button>
        {showStaff && staffRows.map((r,i)=>(
          <div key={i} className="grid md:grid-cols-5 gap-2 mb-2">
            <select value={r.staffName} onChange={e=>{const newRows=[...staffRows]; newRows[i].staffName=e.target.value; setStaffRows(newRows)}} className="border rounded px-2 py-2">{STAFF.map(s=><option key={s}>{s}</option>)}</select>
            <select value={r.task} onChange={e=>{const newRows=[...staffRows]; newRows[i].task=e.target.value; setStaffRows(newRows)}} className="border rounded px-2 py-2">{TASKS.map(t=><option key={t}>{t}</option>)}</select>
            <input type="time" value={r.startTime} onChange={e=>{const newRows=[...staffRows]; newRows[i].startTime=e.target.value; setStaffRows(newRows)}} className="border rounded px-2 py-2"/>
            <input type="time" value={r.endTime} onChange={e=>{const newRows=[...staffRows]; newRows[i].endTime=e.target.value; setStaffRows(newRows)}} className="border rounded px-2 py-2"/>
            <button type="button" onClick={()=>removeStaff(i)} className="bg-red-500 text-white px-3 rounded">X</button>
          </div>
        ))}
      </div>

      {/* Sales Section */}
      <div>
        <button type="button" className="bg-kaiBlue text-white px-5 py-2 rounded font-semibold mb-2" onClick={addSales}>+ Add Sales</button>
        {showSales && salesRows.map((r,i)=>(
          <div key={i} className="grid md:grid-cols-3 gap-2 mb-2">
            <select value={r.productName} onChange={e=>{const newRows=[...salesRows]; newRows[i].productName=e.target.value; setSalesRows(newRows)}} className="border rounded px-2 py-2 w-full">{PRODUCTS.map(p=><option key={p}>{p}</option>)}</select>
            <input type="number" placeholder="Quantity Sold" value={r.quantity} onChange={e=>{const newRows=[...salesRows]; newRows[i].quantity=e.target.value; setSalesRows(newRows)}} className="border rounded px-2 py-2 w-full"/>
            <button type="button" onClick={()=>removeSales(i)} className="bg-red-500 text-white px-3 rounded">X</button>
          </div>
        ))}
        <div className="mt-2 grid md:grid-cols-2 gap-2">
          <input type="number" placeholder="Total Sales $" value={totalSales} onChange={e=>setTotalSales(e.target.value)} className="border rounded px-2 py-2"/>
        </div>
      </div>

      {/* Distribution Section */}
      <div>
        <button type="button" className="bg-kaiGreen text-white px-5 py-2 rounded font-semibold mb-2" onClick={() => { if(!showDistCollectionExtra) setShowDistCollectionExtra(true); addDistribution(); }}>+ Add Distribution / Collection</button>
        
        {/* Bins Collected */}
        <div className="grid md:grid-cols-2 gap-2 mb-2">
          <input type="number" placeholder="Bins Collected" value={binsCollected} onChange={e=>setBinsCollected(e.target.value)} className="border rounded px-2 py-2"/>
          <select value={binSource} onChange={e=>setBinSource(e.target.value)} className="border rounded px-2 py-2">{BIN_SOURCES.map(s=><option key={s}>{s}</option>)}</select>
        </div>

        {/* NEW Distribution / Collection Extra Fields */}
        {showDistCollectionExtra && (
          <div className="bg-slate-50 p-3 rounded-lg mt-3 space-y-2">
            {/* Bins Offal Collected */}
            <div className="grid md:grid-cols-2 gap-2">
              <div>
                <label className="block mb-1 text-sm font-medium text-gray-700">Number of Bins of Offal Collected</label>
                <input
                  type="number"
                  placeholder="Number of Bins of Offal Collected"
                  className="w-full border rounded px-2 py-2 font-sans"
                  value={binsOffalCollected}
                  onChange={e => setBinsOffalCollected(e.target.value)}
                />
              </div>
              <div>
                <label className="block mb-1 text-sm font-medium text-gray-700">Source</label>
                <select
                  className="w-full border rounded px-2 py-2 font-sans"
                  value={binsOffalSource}
                  onChange={e => setBinsOffalSource(e.target.value)}
                >
                  {OFFAL_SOURCES.map(src => <option key={src} value={src}>{src}</option>)}
                </select>
              </div>
            </div>

            {/* Bins Redistributed */}
            <div className="grid md:grid-cols-2 gap-2">
              <div>
                <label className="block mb-1 text-sm font-medium text-gray-700">Number of Bins Redistributed</label>
                <input
                  type="number"
                  placeholder="Number of Bins Redistributed"
                  className="w-full border rounded px-2 py-2 font-sans"
                  value={binsRedistributed}
                  onChange={e => setBinsRedistributed(e.target.value)}
                />
              </div>
              <div>
                <label className="block mb-1 text-sm font-medium text-gray-700">Source</label>
                <select
                  className="w-full border rounded px-2 py-2 font-sans"
                  value={binsRedistributionSource}
                  onChange={e => setBinsRedistributionSource(e.target.value)}
                >
                  {REDISTRIBUTION_SOURCES.map(src => <option key={src} value={src}>{src}</option>)}
                </select>
              </div>
            </div>
          </div>
        )}

        {/* Distribution Rows */}
        {showDistributions && distributionRows.map((r,i)=>(
          <div key={i} className="grid md:grid-cols-3 gap-2 mb-2">
            <input type="number" placeholder="Bins Distributed" value={r.binsDistributed} onChange={e=>{const newRows=[...distributionRows]; newRows[i].binsDistributed=e.target.value; setDistributionRows(newRows)}} className="border rounded px-2 py-2"/>
            <select value={r.distributionTo} onChange={e=>{const newRows=[...distributionRows]; newRows[i].distributionTo=e.target.value; setDistributionRows(newRows)}} className="border rounded px-2 py-2">{DISTRIBUTION_LOCATIONS.map(d=><option key={d}>{d}</option>)}</select>
            <button type="button" onClick={()=>removeDistribution(i)} className="bg-red-500 text-white px-3 rounded">X</button>
          </div>
        ))}
      </div>

      {/* Cans Section */}
      <div>
        <button type="button" className="bg-kaiBurgundy text-white px-5 py-2 rounded font-semibold mb-2" onClick={addCans}>+ Add Cans Drop Off</button>
        {showCans && cansRows.map((r,i)=>(
          <div key={i} className="grid md:grid-cols-3 gap-2 mb-2">
            <input type="number" placeholder="Cans KG" value={r.cansKg} onChange={e=>{const newRows=[...cansRows]; newRows[i].cansKg=e.target.value; setCansRows(newRows)}} className="border rounded px-2 py-2"/>
            <select value={r.cansLocation} onChange={e=>{const newRows=[...cansRows]; newRows[i].cansLocation=e.target.value; setCansRows(newRows)}} className="border rounded px-2 py-2">{CANS_LOCATIONS.map(c=><option key={c}>{c}</option>)}</select>
            <button type="button" onClick={()=>removeCans(i)} className="bg-red-500 text-white px-3 rounded">X</button>
          </div>
        ))}
      </div>

      {/* Other Section */}
      <div className="grid md:grid-cols-2 gap-2">
        <input type="number" placeholder="Fish Monitored" value={fishMonitored} onChange={e=>setFishMonitored(e.target.value)} className="border rounded px-2 py-2"/>
        <input type="number" placeholder="Roe Collected" value={roeCollected} onChange={e=>setRoeCollected(e.target.value)} className="border rounded px-2 py-2"/>
      </div>

      {/* Notes */}
      <div>
        <textarea placeholder="Notes" value={notes} onChange={e=>setNotes(e.target.value)} className="w-full border rounded px-3 py-2"/>
      </div>

      {/* Submit */}
      <div>
        <button type="submit" disabled={loading} className="bg-kaiBurgundy text-white px-6 py-3 rounded font-semibold">{loading ? "Submitting..." : "Submit Report"}</button>
      </div>
    </form>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
