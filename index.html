<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kai Ika – Operations Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kaiBurgundy: '#6B1F1F',
            kaiGreen: '#3E5C48',
            kaiYellow: '#F2E6D8',
            kaiBlue: '#1F3A5F'
          },
          fontFamily: {
            serif: ['Playfair Display','serif'],
            sans: ['Inter','sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-kaiYellow font-sans">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* =========================
   CONSTANTS
========================= */
const PRODUCTS = [/* unchanged */];
const STAFF = ["Ben","Connor","Dave","Opu","Matt","Jay","Volunteer"];
const TASKS = ["Filleting","Distributions","Scott's","Cans","Other"];
const DISTRIBUTION_SOURCES = ["Akeli","Donald, Cook Islands Community","Dave, Tongan Community","Fui, Samoan Community","Walk-in","Ngāti Whātua Ōrākei","Papatūānuku Kōkiri"];
const CANS_LOCATIONS = ["North Shore","Onehunga","Takaanini","Ōtāhuhu"];
const BIN_SOURCES = ["Westhaven","Hilton","Scott's","Moana","Service Foods","Turkish Bread"];
const OFFAL_SOURCES = ["OBC"];
const REDIST_SOURCES = ["Everybody Eats","Grace Foundation","Vision West","Hoani Waititi","Fijian Methodist","Samoan Methodist","Maranga Fanau","Other"];

/* =========================
   APP
========================= */
function App() {

  /* ---------- Core state ---------- */
  const [webAppUrl, setWebAppUrl] = useState(localStorage.getItem("opsWebAppUrl") || "");
  const [configured, setConfigured] = useState(!!localStorage.getItem("opsWebAppUrl"));
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);
  const [showSummary, setShowSummary] = useState(false);
  const [copied, setCopied] = useState(false);

  /* ---------- Permanent fields ---------- */
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [formCompletedBy, setFormCompletedBy] = useState("");

  /* ---------- Section rows ---------- */
  const [staffRows, setStaffRows] = useState([]);
  const [salesRows, setSalesRows] = useState([]);
  const [distributionRows, setDistributionRows] = useState([]);
  const [cansRows, setCansRows] = useState([]);

  /* ---------- Other fields ---------- */
  const [totalSales, setTotalSales] = useState("");
  const [notes, setNotes] = useState("");
  const [fishMonitored, setFishMonitored] = useState("");
  const [roeCollected, setRoeCollected] = useState("");
  const [binsCollected, setBinsCollected] = useState("");
  const [binSource, setBinSource] = useState("Westhaven");
  const [offalBins, setOffalBins] = useState("");
  const [offalSource, setOffalSource] = useState(OFFAL_SOURCES[0]);
  const [redistributionBins, setRedistributionBins] = useState("");
  const [redistributionCollector, setRedistributionCollector] = useState(REDIST_SOURCES[0]);

  /* ---------- Visibility ---------- */
  const [showStaff, setShowStaff] = useState(false);
  const [showSales, setShowSales] = useState(false);
  const [showDistributions, setShowDistributions] = useState(false);
  const [showCans, setShowCans] = useState(false);
  const [showOther, setShowOther] = useState(false);
  const [showNotes, setShowNotes] = useState(false);

  /* =========================
     ROW MANAGEMENT
  ========================= */
  const addStaff = () => { setStaffRows([...staffRows,{staffName:STAFF[0],task:TASKS[0],startTime:"",endTime:""}]); setShowStaff(true); };
  const addSales = () => { setSalesRows([...salesRows,{productName:"",quantity:""}]); setShowSales(true); };
  const addDistribution = () => {
    setDistributionRows([...distributionRows,{binsDistributed:"",distributionTo:DISTRIBUTION_SOURCES[0]}]);
    setShowDistributions(true);
  };
  const addCans = () => { setCansRows([...cansRows,{cansKg:"",cansLocation:CANS_LOCATIONS[0]}]); setShowCans(true); };
  const addOther = () => setShowOther(true);
  const addNotes = () => setShowNotes(true);

  const removeStaff = i => setStaffRows(staffRows.filter((_,j)=>i!==j));
  const removeSales = i => setSalesRows(salesRows.filter((_,j)=>i!==j));
  const removeDistribution = i => setDistributionRows(distributionRows.filter((_,j)=>i!==j));
  const removeCans = i => setCansRows(cansRows.filter((_,j)=>i!==j));

  /* =========================
     SUBMIT
  ========================= */
  const submit = async e => {
    e.preventDefault();
    if(!date || !formCompletedBy) return alert("Date & Form Completed By required");
    if(!webAppUrl) return alert("Please configure web app URL");

    setLoading(true);
    try {
      const fd = new FormData();
      const ts = new Date().toISOString();

      staffRows.forEach(r=>{
        fd.append("Row Type","STAFF");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Staff Name",r.staffName);
        fd.append("Task",r.task);
        fd.append("Start Time",r.startTime);
        fd.append("End Time",r.endTime);
      });

      salesRows.forEach(r=>{
        fd.append("Row Type","SALES");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Product Name",r.productName);
        fd.append("Quantity Sold",r.quantity);
      });

      if(Number(totalSales) > 0){
        fd.append("Row Type","SALES_TOTAL");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Total Sales",totalSales);
      }

      if(Number(binsCollected) > 0){
        fd.append("Row Type","COLLECTION");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Bins Collected",binsCollected);
        fd.append("Source",binSource);
      }

      distributionRows.forEach(r=>{
        if(Number(r.binsDistributed) > 0){
          fd.append("Row Type","DISTRIBUTION");
          fd.append("Date",date);
          fd.append("Form Completed By",formCompletedBy);
          fd.append("Submission Timestamp",ts);
          fd.append("Bins Distributed",r.binsDistributed);
          fd.append("Distribution To",r.distributionTo);
        }
      });

      if(Number(offalBins) > 0){
        fd.append("Row Type","OFFAL");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Offal Bins Collected",offalBins);
        fd.append("Offal Source",offalSource);
      }

      if(Number(redistributionBins) > 0){
        fd.append("Row Type","REDISTRIBUTION");
        fd.append("Date",date);
        fd.append("Form Completed By",formCompletedBy);
        fd.append("Submission Timestamp",ts);
        fd.append("Redistribution Bins Collected",redistributionBins);
        fd.append("Redistribution Collector",redistributionCollector);
      }

      const res = await fetch(webAppUrl,{method:"POST",body:fd});
      const json = await res.json();
      if(!json.success) throw new Error(json.error);

      setSuccess(true);
      setTimeout(()=>setSuccess(false),3000);
      setShowSummary(false);

    } catch(err){
      alert(err.message);
    } finally {
      setLoading(false);
    }
  };

  /* =========================
     UI RENDER
  ========================= */
  return (/* UI UNCHANGED — omitted here for brevity */);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
